name: Package Production Data

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create tar.gz of data/prod
        env:
          FILENAME: "prod-data-${{ github.ref_name }}.tar.gz"
        run: |
          SAFE_FILENAME=$(printf '%s' "${FILENAME//\//-}" | tr -cd 'A-Za-z0-9._-')
          tar -czf "$SAFE_FILENAME" \
            --exclude="*.html" \
            --exclude="*.svg" \
            --exclude="*.pkl" \
            data/prod/
          printf 'FILENAME=%s\n' "$SAFE_FILENAME" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.FILENAME }}
