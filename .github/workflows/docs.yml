name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Generate tissue pages from data
        run: python docs/generate_pages.py

      - name: Build Sphinx documentation
        run: sphinx-build -b html docs docs/_build/html

      # Hits the Pages REST API, which 404s on forks without Pages enabled.
      - name: Setup Pages
        if: github.repository_owner == 'NIH-NLM'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.repository_owner == 'NIH-NLM'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  # Only the NIH-NLM upstream publishes the site; forks don't have Pages
  # enabled, so deploying there fails.
  deploy:
    if: github.repository_owner == 'NIH-NLM'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
