name: Promote to NIH-NLM upstream

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so concurrent pushes can't both pass the EXISTING-empty check
# and race on PR creation (which would 422 the loser). Don't cancel the
# in-flight run — its commits still need promoting.
concurrency:
  group: promote-to-upstream
  cancel-in-progress: false

jobs:
  promote:
    # Skip when this workflow runs on the NIH-NLM upstream (it would get there
    # when an upstream PR from this fork merges). Only fire on Springbok-LLC.
    if: github.repository_owner == 'Springbok-LLC'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update upstream PR
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::UPSTREAM_PR_TOKEN secret is not configured on this fork — see this repo's promote-to-upstream PR for setup instructions."
            exit 1
          fi

          UPSTREAM=NIH-NLM/nlm-ckn
          FORK=Springbok-LLC/nlm-ckn

          # Unlike the nlm-ckn-ui workflow, this repo's upstream requires an
          # approving review (no admin bypass). We open or update the PR and
          # stop — Anne (or whoever owns review) merges it upstream when
          # ready. No fast-forward via the Refs API either, since that would
          # bypass the approval gate entirely.

          # Don't use the compare API (repos/$UPSTREAM/compare/main...fork:main)
          # for this: it always builds a diff, and since this repo is large, this can fail with
          # "Sorry, this diff is taking too long to generate" (HTTP 422). Count
          # the divergence with git instead — a commits-only partial fetch
          # (--filter=tree:0) of the two tips takes a couple of seconds and a
          # few hundred KB, and needs no working tree.
          rm -rf divergence.git
          trap 'rm -rf divergence.git' EXIT
          git init --bare -q divergence.git
          AUTH_HEADER="Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="$AUTH_HEADER" \
            git -C divergence.git fetch -q --filter=tree:0 --no-tags \
              "https://github.com/$FORK.git" main:refs/remotes/fork/main
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="$AUTH_HEADER" \
            git -C divergence.git fetch -q --filter=tree:0 --no-tags \
              "https://github.com/$UPSTREAM.git" main:refs/remotes/upstream/main

          # rev-list --left-right --count prints "<left> <right>": commits on
          # upstream/main only (behind), then commits on fork/main only (ahead).
          COUNTS=$(git -C divergence.git rev-list --left-right --count \
            refs/remotes/upstream/main...refs/remotes/fork/main)
          set -- $COUNTS
          BEHIND=$1
          AHEAD=$2
          echo "Compare upstream/main...fork/main: ahead_by=$AHEAD, behind_by=$BEHIND"

          if [ "$AHEAD" = "0" ]; then
            echo "Fork is not ahead of upstream — nothing to promote."
            exit 0
          fi

          if [ "$BEHIND" != "0" ]; then
            echo "::warning::Fork is $BEHIND commits behind upstream — the promoted PR may have conflicts requiring manual resolution."
          fi

          find_existing_pr() {
            gh api -X GET "repos/$UPSTREAM/pulls" \
              -F head=Springbok-LLC:main \
              -F base=main \
              -F state=open \
              --jq '.[0].number // empty'
          }

          EXISTING=$(find_existing_pr)

          if [ -n "$EXISTING" ]; then
            echo "Upstream PR already open: #$EXISTING ($AHEAD ahead, $BEHIND behind). Fork pushes will append to it automatically."
            exit 0
          fi

          echo "Opening upstream PR ($AHEAD ahead, $BEHIND behind)."
          BODY=$(cat <<EOF
          Automated promotion from Springbok-LLC fork ($AHEAD commit(s) ahead, $BEHIND behind).

          Awaits the upstream approval requirement; this workflow does not merge.

          Workflow run: https://github.com/$FORK/actions/runs/$GITHUB_RUN_ID
          EOF
          )
          for i in 1 2 3; do
            if PR_NUM=$(gh api "repos/$UPSTREAM/pulls" \
                 -f title="Promote Springbok-LLC main to upstream" \
                 -f head="Springbok-LLC:main" \
                 -f base="main" \
                 -f body="$BODY" \
                 --jq '.number'); then
              echo "Created upstream PR #$PR_NUM."
              exit 0
            fi
            # The create can succeed server-side and still report an error to
            # the client (a 502 from the API gateway did exactly this on run
            # 31621460361, and the retries then failed 422 "already exists",
            # failing the job over a PR that had in fact been opened). Re-check
            # before retrying so a phantom failure doesn't fail the job.
            PR_NUM=$(find_existing_pr || true)
            if [ -n "$PR_NUM" ]; then
              echo "Upstream PR #$PR_NUM is open — attempt $i reported an error but the PR exists. Nothing more to do."
              exit 0
            fi
            if [ "$i" = 3 ]; then break; fi
            echo "PR creation attempt $i failed; sleeping $((i * 10))s before retry."
            sleep $((i * 10))
          done

          echo "::error::Failed to open upstream PR after 3 attempts."
          exit 1
